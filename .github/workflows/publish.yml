name: Test and publish website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'arena/4880796f-ominicorp']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Smoke-test the image using Compose
        env:
          OMINICORP_IMAGE: ominicorp:ci
        run: |
          docker build --network=none -t "$OMINICORP_IMAGE" .
          docker compose up -d --pull never --wait --wait-timeout 45
          curl -fsS http://127.0.0.1:8080/ | grep 'lang="fa"'
          curl -fsS http://127.0.0.1:8080/en.html | grep 'lang="en"'
          curl -fsSI http://127.0.0.1:8080/assets/site.mjs | grep -i 'content-type: text/javascript'
          curl -fsSI http://127.0.0.1:8080/assets/fonts/vazirmatn-arabic-wght-normal.woff2
          curl -fsSI http://127.0.0.1:8080/assets/media/hero.webp
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/omixy)" = 404
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/4880796f-ominicorp')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: image
        name: Select registry and release tags
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          channel=preview
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then channel=latest; fi
          echo "tags=$image:$channel,$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          network: none
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
