name: Test and publish website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'arena/578cb0c8-ominicorp']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Smoke-test the image using Compose
        run: |
          docker build -t ghcr.io/parsalakzian/ominicorp:latest .
          docker compose up -d --pull never --wait --wait-timeout 45
          docker compose exec -T website test -f /app/data/subscribers.sqlite
          docker compose exec -T website node server/setup.mjs > /dev/null
          curl -fsS http://127.0.0.1:8080/ | grep 'lang="fa"'
          curl -fsS http://127.0.0.1:8080/en.html | grep 'lang="en"'
          curl -fsSI http://127.0.0.1:8080/assets/site.mjs | grep -i 'content-type: text/javascript'
          curl -fsSI http://127.0.0.1:8080/assets/fonts/vazirmatn-arabic-wght-normal.woff2
          curl -fsSI http://127.0.0.1:8080/assets/media/hero.webp
          curl -fsS http://127.0.0.1:8080/blog | grep 'rel="canonical"'
          curl -fsS http://127.0.0.1:8080/en/blog/category/security | grep '<h1>Security</h1>'
          curl -fsS http://127.0.0.1:8080/en/blog/first-ai-workflow | grep 'BlogPosting'
          curl -fsS http://127.0.0.1:8080/sitemap.xml | grep 'hreflang="en"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin)" = 303
          curl -fsS http://127.0.0.1:8080/admin/setup | grep 'name="confirmation"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/mcp)" = 404
          curl -fsS -H 'Accept: text/html' http://127.0.0.1:8080/mcp/ | grep 'Streamable HTTP'
          test "$(curl -s -o /dev/null -w '%{http_code}' --data-binary 'sample' http://127.0.0.1:8080/mcp/media)" = 404
          docker compose exec -T website test -f /app/data/blog.sqlite
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/omixy)" = 404
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/578cb0c8-ominicorp')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: image
        name: Select registry and release tags
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          channel=preview
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then channel=latest; fi
          echo "reference=$image:$channel" >> "$GITHUB_OUTPUT"
          echo "tags=$image:$channel,$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Confirm published platforms and report digest
        env:
          REFERENCE: ${{ steps.image.outputs.reference }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          manifest=$(docker buildx imagetools inspect --raw "$REFERENCE@$DIGEST")
          jq -e '.manifests | any(.platform.os == "linux" and .platform.architecture == "amd64")' <<< "$manifest"
          jq -e '.manifests | any(.platform.os == "linux" and .platform.architecture == "arm64")' <<< "$manifest"
          printf 'Published `%s` (`%s`) for Linux AMD64 and ARM64.\n' "$REFERENCE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
