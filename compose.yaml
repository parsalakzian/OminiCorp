services:
  website:
    image: ghcr.io/parsalakzian/ominicorp:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    read_only: true
    volumes:
      - subscribers:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  subscribers:
